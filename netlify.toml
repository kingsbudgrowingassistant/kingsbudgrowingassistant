# Netlify configuration for Kings Bud Grow Assistant
# This file tells Netlify how to build and serve the Next.js app.
# Deploy by connecting your GitHub repo at https://app.netlify.com

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "https://zkfwflwdzfuepurzlljc.supabase.co
  sb_publishable_UuwftSQ_svmbUcKAO42wOw_hDK2vSDw"

# The @netlify/plugin-nextjs handles Next.js SSR/SSG automatically.
# It's installed via package.json devDependencies.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively (Next.js chunks have content hashes)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache PWA icons
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache the service worker — always serve fresh
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Don't cache the manifest — serve fresh
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
