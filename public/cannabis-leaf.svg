<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280">
  <defs>
    <!-- Realistic cannabis leaf gradient — vibrant green center fading to darker edges -->
    <radialGradient id="leafFill" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="35%" stop-color="#4ade80"/>
      <stop offset="75%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <!-- Subtle gold sheen over the leaf surface -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>
    <!-- Gold edge highlight stroke -->
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Single large realistic cannabis leaf, centered in the tile -->
  <g transform="translate(140 140)">
    <!-- Soft outer glow -->
    <g opacity="0.18">
      <path d="M0,-110 C 6,-90 9,-65 9,-40 L 22,-30 14,-25 26,-15 14,-12 28,0 12,-1 22,15 6,12 14,28 -2,18 0,38 -2,18 -14,28 -6,12 -22,15 -12,-1 -28,0 -14,-12 -26,-15 -14,-25 -22,-30 -9,-40 C -9,-65 -6,-90 0,-110 Z"
            fill="#fde68a" transform="scale(1.15)"/>
    </g>

    <!-- Center (top) leaflet — large, pointed -->
    <path d="M0,-110 C 6,-90 9,-65 9,-40 L 22,-30 14,-25 26,-15 14,-12 28,0 12,-1 22,15 6,12 14,28 -2,18 0,38 -2,18 -14,28 -6,12 -22,15 -12,-1 -28,0 -14,-12 -26,-15 -14,-25 -22,-30 -9,-40 C -9,-65 -6,-90 0,-110 Z"
          fill="url(#leafFill)" stroke="url(#goldEdge)" stroke-width="1.4" stroke-linejoin="round"/>

    <!-- Upper side leaflets (pair 1) -->
    <g transform="rotate(35)">
      <path d="M0,-90 C 5,-72 7,-50 7,-30 L 18,-22 12,-18 22,-10 12,-8 22,4 10,3 18,18 4,14 12,30 -2,20 0,30 -2,20 -12,30 -4,14 -18,18 -10,3 -22,4 -12,-8 -22,-10 -12,-18 -18,-22 -7,-30 C -7,-50 -5,-72 0,-90 Z"
            fill="url(#leafFill)" stroke="url(#goldEdge)" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(-35)">
      <path d="M0,-90 C 5,-72 7,-50 7,-30 L 18,-22 12,-18 22,-10 12,-8 22,4 10,3 18,18 4,14 12,30 -2,20 0,30 -2,20 -12,30 -4,14 -18,18 -10,3 -22,4 -12,-8 -22,-10 -12,-18 -18,-22 -7,-30 C -7,-50 -5,-72 0,-90 Z"
            fill="url(#leafFill)" stroke="url(#goldEdge)" stroke-width="1.2" stroke-linejoin="round"/>
    </g>

    <!-- Middle side leaflets (pair 2) -->
    <g transform="rotate(60)">
      <path d="M0,-80 C 4,-62 6,-44 6,-26 L 16,-18 10,-15 18,-8 10,-6 18,4 8,3 14,16 3,12 10,26 -2,18 0,26 -2,18 -10,26 -3,12 -14,16 -8,3 -18,4 -10,-6 -18,-8 -10,-15 -16,-18 -6,-26 C -6,-44 -4,-62 0,-80 Z"
            fill="url(#leafFill)" stroke="url(#goldEdge)" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(-60)">
      <path d="M0,-80 C 4,-62 6,-44 6,-26 L 16,-18 10,-15 18,-8 10,-6 18,4 8,3 14,16 3,12 10,26 -2,18 0,26 -2,18 -10,26 -3,12 -14,16 -8,3 -18,4 -10,-6 -18,-8 -10,-15 -16,-18 -6,-26 C -6,-44 -4,-62 0,-80 Z"
            fill="url(#leafFill)" stroke="url(#goldEdge)" stroke-width="1.2" stroke-linejoin="round"/>
    </g>

    <!-- Lower side leaflets (pair 3, smaller, near stem) -->
    <g transform="rotate(82)">
      <path d="M0,-65 C 3,-50 5,-36 5,-22 L 13,-15 8,-12 14,-6 8,-4 14,4 6,3 11,14 2,10 8,22 -2,16 0,22 -2,16 -8,22 -2,10 -11,14 -6,3 -14,4 -8,-4 -14,-6 -8,-12 -13,-15 -5,-22 C -5,-36 -3,-50 0,-65 Z"
            fill="url(#leafFill)" stroke="url(#goldEdge)" stroke-width="1.1" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(-82)">
      <path d="M0,-65 C 3,-50 5,-36 5,-22 L 13,-15 8,-12 14,-6 8,-4 14,4 6,3 11,14 2,10 8,22 -2,16 0,22 -2,16 -8,22 -2,10 -11,14 -6,3 -14,4 -8,-4 -14,-6 -8,-12 -13,-15 -5,-22 C -5,-36 -3,-50 0,-65 Z"
            fill="url(#leafFill)" stroke="url(#goldEdge)" stroke-width="1.1" stroke-linejoin="round"/>
    </g>

    <!-- Central vein + side veins in gold -->
    <g stroke="url(#goldEdge)" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.85">
      <!-- Center vein -->
      <path d="M0,-105 L0,38"/>
      <!-- Side veins on center leaflet -->
      <path d="M0,-50 L-18,-30"/>
      <path d="M0,-50 L18,-30"/>
      <path d="M0,-25 L-25,-10"/>
      <path d="M0,-25 L25,-10"/>
      <path d="M0,5 L-15,18"/>
      <path d="M0,5 L15,18"/>
    </g>

    <!-- Gold sheen overlay on the entire leaf -->
    <path d="M0,-110 C 6,-90 9,-65 9,-40 L 22,-30 14,-25 26,-15 14,-12 28,0 12,-1 22,15 6,12 14,28 -2,18 0,38 -2,18 -14,28 -6,12 -22,15 -12,-1 -28,0 -14,-12 -26,-15 -14,-25 -22,-30 -9,-40 C -9,-65 -6,-90 0,-110 Z"
          fill="url(#goldSheen)"/>

    <!-- Stem with gold gradient -->
    <path d="M-3,38 L-3,115 Q-3,123 0,123 Q3,123 3,115 L3,38 Z"
          fill="url(#leafFill)" stroke="url(#goldEdge)" stroke-width="0.8"/>
  </g>
</svg>
